[project]
name = "mdp-designs"
version = "0.1.0"
description = "Contains 10 different kinds of MDP system designs"
authors = [
    {name = "ignius299792458"}
]
requires-python = ">=3.12"

dependencies = [
    "pygame (>=2.6.1,<3.0.0)"
]

[tool.poetry]
packages = [{include = "mdp_designs", from = "src"}]



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.3.0,<8.0.0)"
]
